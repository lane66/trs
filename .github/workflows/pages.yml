name: Deploy resistome map to GitHub Pages
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Locate app
        id: app
        shell: bash
        run: |
          if [ -f build-static.py ]; then
            echo 'directory=.' >> "$GITHUB_OUTPUT"
          else
            echo 'directory=hong-kong-arg-map' >> "$GITHUB_OUTPUT"
          fi
      - name: Check calculation helpers
        working-directory: ${{ steps.app.outputs.directory }}
        run: |
          node --check app.js
          node test-comparison.cjs
          node test-static.cjs
      - name: Build static site
        working-directory: ${{ steps.app.outputs.directory }}
        run: python3 build-static.py
      - name: Verify static index against original profiles
        working-directory: ${{ steps.app.outputs.directory }}
        run: python3 validate-static.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ steps.app.outputs.directory }}/dist
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
